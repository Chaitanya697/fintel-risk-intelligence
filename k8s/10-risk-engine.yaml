# Risk engine: analytics + ensemble ML API (2 replicas, reads data/model from S3)
apiVersion: apps/v1
kind: Deployment
metadata: {name: risk-engine, namespace: fintel, labels: {app: risk-engine}}
spec:
  replicas: 2
  selector: {matchLabels: {app: risk-engine}}
  template:
    metadata: {labels: {app: risk-engine}}
    spec:
      imagePullSecrets: [{name: ecr-pull}]
      containers:
        - name: risk-engine
          image: __REGISTRY__/fintel-risk-engine:__TAG__
          ports: [{containerPort: 8001}]
          env:
            - {name: DATA_BACKEND, value: s3}
            - {name: S3_BUCKET, valueFrom: {configMapKeyRef: {name: fintel-config, key: S3_BUCKET}}}
            - {name: AWS_REGION, valueFrom: {configMapKeyRef: {name: fintel-config, key: AWS_REGION}}}
          readinessProbe: {httpGet: {path: /ready, port: 8001}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 20, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 300Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: risk-engine, namespace: fintel}
spec:
  selector: {app: risk-engine}
  ports: [{port: 8001, targetPort: 8001}]
---
apiVersion: v1
kind: Service
metadata: {name: risk-engine-headless, namespace: fintel}
spec:
  clusterIP: None
  selector: {app: risk-engine}
  ports: [{port: 8001}]
