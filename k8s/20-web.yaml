# Web dashboard: login, case files (SQLite on a persistent volume), courtroom UI
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: web-db, namespace: fintel}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: fintel, labels: {app: web}}
spec:
  replicas: 1            # SQLite file on a single volume -> one writer
  strategy: {type: Recreate}
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      imagePullSecrets: [{name: ecr-pull}]
      securityContext: {fsGroup: 10001}
      containers:
        - name: web
          image: __REGISTRY__/fintel-web:__TAG__
          ports: [{containerPort: 8000}]
          env:
            - {name: ENGINE_URL, value: "http://risk-engine:8001"}
            - {name: DB_PATH, value: /data/db/fintel.db}
            - {name: SECRET_KEY, valueFrom: {secretKeyRef: {name: fintel-secret, key: SECRET_KEY}}}
            - {name: GRAFANA_URL, valueFrom: {configMapKeyRef: {name: fintel-config, key: GRAFANA_URL}}}
          volumeMounts: [{name: db, mountPath: /data/db}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes: [{name: db, persistentVolumeClaim: {claimName: web-db}}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: fintel}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata: {name: web-headless, namespace: fintel}
spec:
  clusterIP: None
  selector: {app: web}
  ports: [{port: 8000}]
