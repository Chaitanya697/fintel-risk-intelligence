# Local run (laptop with Docker Desktop) - same containers as the cloud, data in ./data instead of S3.
#   1) put the Kaggle CSVs in ./data/raw/
#   2) docker compose run --rm data-processor      (cleans data + trains the model, ~1 min)
#   3) docker compose up -d --build
#   App http://localhost:8000   Grafana http://localhost:3000   Prometheus http://localhost:9090
services:
  data-processor:
    build: {context: ., dockerfile: services/data-processor/Dockerfile}
    image: fintel-data-processor:local
    profiles: ["train"]
    user: "0"
    environment: {DATA_BACKEND: local, LOCAL_DATA_DIR: /data}
    volumes: ["./data:/data"]

  risk-engine:
    build: {context: ., dockerfile: services/risk-engine/Dockerfile}
    image: fintel-risk-engine:local
    environment: {DATA_BACKEND: local, LOCAL_DATA_DIR: /data}
    volumes: ["./data:/data:ro"]
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: services/web/Dockerfile}
    image: fintel-web:local
    environment:
      ENGINE_URL: http://risk-engine:8001
      SECRET_KEY: change-me-local-only
      GRAFANA_URL: http://localhost:3000/d/fintel-ops
    volumes: ["webdb:/data/db"]
    ports: ["8000:8000"]
    depends_on: [risk-engine]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes: ["./monitoring/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: fintel-admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  webdb:
